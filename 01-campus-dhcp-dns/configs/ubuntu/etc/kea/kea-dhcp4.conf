{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": [ "*" ],
      "service-sockets-max-retries": 10,
      "service-sockets-retry-wait-time": 5000
    },
    "control-socket": {
      "socket-type": "unix",
      "socket-name": "/run/kea/kea4-ctrl-socket"
    },
    "lease-database": {
      "type": "memfile",
      "persist": true,
      "name": "/var/lib/kea/kea-leases4.csv",
      "lfc-interval": 3600
    },
    "authoritative": true,
    "valid-lifetime": 28800,
    "renew-timer": 14400,
    "rebind-timer": 25200,
    "option-data": [
      { "name": "domain-name-servers", "data": "192.168.100.10" },
      { "name": "domain-name",         "data": "campus.internal" },
      { "name": "domain-search",       "data": "campus.internal" }
    ],
    "subnet4": [
      {
        "id": 10,
        "subnet": "192.168.10.0/24",
        "user-context": { "vlan": 10, "gateway-switch": "CORE-1" },
        "pools": [ { "pool": "192.168.10.100 - 192.168.10.200" } ],
        "option-data": [ { "name": "routers", "data": "192.168.10.1" } ]
      },
      {
        "id": 20,
        "subnet": "192.168.20.0/24",
        "user-context": { "vlan": 20, "gateway-switch": "CORE-1" },
        "pools": [ { "pool": "192.168.20.100 - 192.168.20.200" } ],
        "option-data": [ { "name": "routers", "data": "192.168.20.1" } ]
      },
      {
        "id": 30,
        "subnet": "192.168.30.0/24",
        "user-context": { "vlan": 30, "gateway-switch": "CORE-2" },
        "pools": [ { "pool": "192.168.30.100 - 192.168.30.200" } ],
        "option-data": [ { "name": "routers", "data": "192.168.30.1" } ]
      },
      {
        "id": 40,
        "subnet": "192.168.40.0/24",
        "user-context": { "vlan": 40, "gateway-switch": "CORE-2" },
        "pools": [ { "pool": "192.168.40.100 - 192.168.40.200" } ],
        "option-data": [ { "name": "routers", "data": "192.168.40.1" } ]
      },
      {
        "id": 50,
        "subnet": "192.168.50.0/24",
        "user-context": { "vlan": 50, "gateway-switch": "CORE-3" },
        "pools": [ { "pool": "192.168.50.100 - 192.168.50.200" } ],
        "option-data": [ { "name": "routers", "data": "192.168.50.1" } ]
      },
      {
        "id": 60,
        "subnet": "192.168.60.0/24",
        "user-context": { "vlan": 60, "gateway-switch": "CORE-3" },
        "pools": [ { "pool": "192.168.60.100 - 192.168.60.200" } ],
        "option-data": [ { "name": "routers", "data": "192.168.60.1" } ]
      }
    ],
    "loggers": [
      {
        "name": "kea-dhcp4",
        "output_options": [
          { "output": "stdout", "pattern": "%-5p %m\n" },
          { "output": "/var/log/kea/kea-dhcp4.log", "maxsize": 10485760, "maxver": 3 }
        ],
        "severity": "INFO"
      }
    ]
  }
}
